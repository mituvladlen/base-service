# Local stack: PostgreSQL (named volume) + base-service.
# Credentials come from .env (gitignored). Start: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - base_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  base-service:
    build: .
    image: ${DOCKERHUB_USER:-local}/base-service:1.0.0
    env_file: .env
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Inside Docker "localhost" is the container itself: reach a Resource Service on the host machine
      RESOURCE_SERVICE_URL: ${DOCKER_RESOURCE_SERVICE_URL:-http://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy

volumes:
  base_pgdata:
